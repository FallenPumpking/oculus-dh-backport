name: Alpha test report
description: Report successful tests or remaining failures
labels: [testing]
body:
  - type: textarea
    id: environment
    attributes:
      label: Exact versions and hardware
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: Tests and results
      description: Use docs/TESTING.md. Include session duration and mark untested checks explicitly.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and related issues
      description: Redacted logs, screenshots and links to separate reproducible bug reports.
