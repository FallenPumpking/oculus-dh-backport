name: Build and validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch locked dependencies
        run: python scripts/fetch-dependencies.py
      - name: Build and projection regression checks
        run: bash gradlew build projectionChecks --no-daemon
      - name: Package and verify notices and source
        run: python scripts/package-release.py
      - uses: actions/upload-artifact@v4
        with:
          name: alpha-test-artifacts
          path: dist/*
          if-no-files-found: error
          retention-days: 30
